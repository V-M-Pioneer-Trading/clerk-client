name: ci

on:
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. Filtering to main means a stacked PR runs
  # nothing at all and looks green by default.
  pull_request:
  push:
    branches: [main]

# Read-only for the whole workflow. Nothing here publishes anything; the
# release workflow is the only place `contents: write` appears, and it is
# scoped to one job there.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # is a movable pointer in someone else's repository, and `@v4` silently
      # becomes whatever they push to it. The comment records which release
      # the SHA was, so a reviewer can read the intent and a bump is a visible
      # diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ts-jest only typechecks what a test imports, so without this a type
      # error in an unreferenced file reaches main.
      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      # Every fenced ts/js snippet in README.md is extracted, compiled and RUN.
      # The README is the migration instructions for three services, and a
      # snippet that `secured()` refuses at registration is a defect of the
      # same size as a broken export — which is exactly what the fourth review
      # found in the generated-router section. Compiling is not enough to catch
      # that, because the refusal happens when the snippet runs.
      - run: npm run check:readme

      # The tarball a consumer installs is built here too, so a `files` list
      # that forgot dist/ fails before a tag is ever pushed.
      - name: Pack and check the tarball's contents
        run: |
          npm pack --silent > /dev/null
          tarball=$(ls ./*.tgz)
          tar -tzf "$tarball" | sort > packed.txt
          cat packed.txt
          for required in package/package.json package/README.md package/LICENSE \
                          package/dist/index.js package/dist/index.d.ts; do
            grep -qx "$required" packed.txt || {
              echo "::error::$required is missing from the tarball"; exit 1; }
          done
          # Nothing outside dist/ and the three metadata files ships.
          if grep -vqE '^package/(package\.json|README\.md|LICENSE|dist/)' packed.txt; then
            echo "::error::the tarball carries files outside dist/"
            grep -vE '^package/(package\.json|README\.md|LICENSE|dist/)' packed.txt
            exit 1
          fi

      # Two probes, because the package makes two different claims.
      #
      # 1. The CORE claim: a consumer that does not use Express at all can
      #    typecheck this package with `skipLibCheck: false` and WITHOUT
      #    `@types/express` installed. `skipLibCheck: true` (the old setting
      #    here) suppresses exactly the error that would catch a `.d.ts`
      #    referencing a package the consumer has not got, so the probe was
      #    passing without testing anything. The adapter's types are declared
      #    locally in src/express.ts for this reason.
      #
      # 2. The ADAPTER claim: a consumer that DOES use Express can hand a real
      #    `app.use(...)` the handler this package returns, and read
      #    `res.locals` back through the accessors, with no cast.
      - name: Install the tarball into a scratch CommonJS project
        run: |
          tarball=$(readlink -f ./*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$tarball" > /dev/null
          # require() works, and every export is really there.
          node -e "
            const c = require('@v-m-pioneer-trading/clerk-client');
            for (const name of ['createAuthorizer','createExpressAuth','createLaneDeriver','loadIntrospectionConfig','isSafeMethod','MESSAGES','createCentralM2MTokenSource','M2MTokenError']) {
              if (typeof c[name] === 'undefined') throw new Error('missing export ' + name);
            }
            console.log('require() ok');
          "
          npm install --no-save typescript@5 @types/node@22 > /dev/null
          # The installed tree must not have pulled Express in as a peer.
          if [ -d node_modules/@types/express ]; then
            echo "::error::@types/express is installed; the core probe would not prove anything"
            exit 1
          fi
          cat > tsconfig.core.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "commonjs",
              "moduleResolution": "node",
              "strict": true,
              "skipLibCheck": false,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["probe-core.ts"]
          }
          JSON
          cat > probe-core.ts <<'TS'
          import {
            createAuthorizer,
            createLaneDeriver,
            isSafeMethod,
            type Decision,
            type Identity,
            type Lane,
          } from "@v-m-pioneer-trading/clerk-client";

          const config = { url: "http://localhost:3005/auth/v1/introspect", secret: "x" };
          const authorizer = createAuthorizer(config);
          const deriver = createLaneDeriver(config);

          export async function probe(): Promise<[Decision, Lane, Identity | null, boolean]> {
            const decision = await authorizer.authorize({
              method: "POST",
              requires: "fleet:control",
              authorization: "Bearer opaque",
            });
            const lane = await deriver.derive("Bearer opaque");
            return [
              decision,
              lane,
              decision.outcome === "proceed" ? decision.identity : null,
              isSafeMethod("HEAD"),
            ];
          }
          TS
          npx tsc -p tsconfig.core.json
          echo "core types resolve with skipLibCheck: false and no @types/express"

      - name: Typecheck the adapter against a real Express consumer
        run: |
          cd /tmp/consumer
          # typescript and @types/node are re-listed because the previous step
          # installed them with --no-save, and npm prunes anything not in
          # package.json on the next install.
          npm install --no-save typescript@5 @types/node@22 express@4 @types/express@4 > /dev/null
          cat > tsconfig.express.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "commonjs",
              "moduleResolution": "node",
              "esModuleInterop": true,
              "strict": true,
              // false, like the core probe: the adapter claims its .d.ts is
              // clean against a real consumer's own settings, and
              // skipLibCheck: true suppresses exactly the errors that would
              // disprove it.
              "skipLibCheck": false,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["probe-express.ts"]
          }
          JSON
          cat > probe-express.ts <<'TS'
          import express from "express";
          import {
            actorOf,
            createExpressAuth,
            hasScope,
            identityOf,
            kindOf,
            notFound,
            passthrough,
            secured,
          } from "@v-m-pioneer-trading/clerk-client";

          const auth = createExpressAuth({
            url: "http://localhost:3005/auth/v1/introspect",
            secret: "x",
          });

          export const app = express();

          // A secured router must still BE an express.Router to the compiler:
          // `secured()` returns its argument's own type, so mounting, nesting
          // and every Express signature survive it.
          const api = secured(express.Router());
          api.use(passthrough(express.json(), "parses bodies; never answers"));

          // No cast anywhere: the locally declared handler type has to be
          // structurally acceptable to a real Express route registration.
          api.get("/health", auth.allowPublic(), (_req, res) => {
            res.json({ actor: actorOf(res) });
          });
          api.get("/targets/:id", auth.requireSession(), (_req, res) => {
            res.json({ identity: identityOf(res) });
          });
          api.post("/targets", auth.requireScope("fleet:control"), (_req, res) => {
            res.json({
              actor: actorOf(res),
              kind: kindOf(res),
              identity: identityOf(res),
              refreshes: hasScope(res, "universe:refresh"),
            });
          });
          app.use("/api/automation/v1", api);

          // The generated-router shape: the guard leads the MOUNT, because a
          // router tsoa generated onto cannot be secured() and cannot be
          // mounted bare. Its resolver is keyed on the METHOD, which is all it
          // is given; `undefined` means undeclared, and there is deliberately
          // no `?? "none"` to write. The runtime step below registers this
          // same shape and makes real requests through it.
          const generated = express.Router();
          app.use(
            "/api/fleet/v1",
            auth.guard(({ method }) => (method === "GET" ? "session" : "fleet:control")),
            generated
          );

          // The declared-mount constructs the three consumers actually have:
          // a third-party middleware list and a body parser behind one
          // leading declaration, and a terminal JSON 404 of arity 2.
          const secureApp = secured(express());
          secureApp.use(
            "/proxy",
            auth.requireSession(),
            express.raw({ type: "*/*", limit: "5mb" }),
            (_req, res) => {
              res.json({ proxied: true });
            }
          );
          secureApp.use("/assets", auth.allowPublic(), express.static("public"));
          secureApp.use(
            notFound((_req, res) => {
              res.status(404).json({ error: { message: "not found" } });
            })
          );
          TS
          npx tsc -p tsconfig.express.json
          echo "the adapter typechecks against a real Express app with no cast"

      # The claims that matter most about `secured()` are RUNTIME ones, and a
      # typecheck cannot see them. Proven against the packed tarball rather
      # than the source tree, because that is what a consumer installs.
      - name: Prove the tarball enforces the registration rules at startup
        run: |
          cd /tmp/consumer
          node -e "
            const express = require('express');
            const { createExpressAuth, notFound, passthrough, secured } =
              require('@v-m-pioneer-trading/clerk-client');
            const auth = createExpressAuth({ url: 'http://localhost:3005/auth/v1/introspect', secret: 'x' });
            const handler = (_req, res) => res.json({});
            const refuses = (what, fn) => {
              let threw = false;
              try { fn(); } catch { threw = true; }
              if (!threw) throw new Error('accepted: ' + what);
            };

            refuses('an undeclared route', () => secured(express.Router()).get('/ships', handler));
            refuses('a declaration after the handler', () =>
              secured(express.Router()).get('/ships', handler, auth.requireScope('fleet:control')));
            refuses('two declarations on one route', () =>
              secured(express.Router()).get('/ships', auth.requireSession(), auth.allowPublic(), handler));
            refuses('an undeclared route() chain', () =>
              secured(express.Router()).route('/ships').get(handler));
            refuses('a use() of a bare middleware', () => secured(express.Router()).use(handler));
            refuses('requireScope(\"none\")', () => auth.requireScope('none'));
            refuses('requireScope(\"session\")', () => auth.requireScope('session'));

            // And the constructs the consumers actually have are accepted.
            const api = secured(express.Router());
            api.get('/ships', auth.requireSession(), handler);
            api.use(passthrough(express.json(), 'parses bodies; never answers'));
            const app = secured(express());
            app.use('/proxy', auth.requireSession(), express.raw({ type: '*/*' }), handler);
            app.use('/swagger', auth.allowPublic(), [handler], handler);
            app.use(notFound((_req, res) => res.status(404).json({ error: { message: 'not found' } })));
            app.use((err, _req, res, _next) => res.status(500).json({ error: { message: String(err) } }));
            refuses('a route after notFound()', () => app.get('/late', auth.allowPublic(), handler));

            refuses('a notFound() on a path', () =>
              secured(express()).use('/admin', notFound(handler)));
            refuses('a notFound() alongside another handler', () =>
              secured(express()).use(notFound(handler), handler));
            refuses('a bare express.Router(), which is a function of arity 3', () =>
              secured(express()).use('/api/fleet/v1', express.Router()));

            console.log('secured() enforces position, arity, the reserved words and the terminal');
          "

      # The claims a typecheck REALLY cannot see: what the generated-router
      # mount does to live requests, and that the terminal cannot be made to
      # answer a success. fleet-service's whole surface is a tsoa-generated
      # router, so this shape is the one the README tells it to write and the
      # one the fourth review found documented wrong. Registered for real and
      # driven over HTTP, from the packed tarball.
      - name: Prove the generated-router mount enforces at runtime, from the tarball
        run: |
          cd /tmp/consumer
          npm install --no-save express@4 > /dev/null
          cat > runtime-generated.js <<'JS'
          const http = require('node:http');
          const express = require('express');
          const {
            createExpressAuth,
            notFound,
            secured,
          } = require('@v-m-pioneer-trading/clerk-client');

          // A stand-in auth-service. `session.token` is an active session with
          // NO scopes, which is what separates a 200 from a 403 below.
          const TOKENS = {
            'session.token': {
              active: true, sub: 'user_guest', kind: 'operator', scope: '', exp: 4102444800,
            },
            'operator.token': {
              active: true, sub: 'user_operator', kind: 'operator',
              scope: 'fleet:control', exp: 4102444800,
            },
          };
          let centerCalls = 0;
          const center = http.createServer((req, res) => {
            const chunks = [];
            req.on('data', (c) => chunks.push(c));
            req.on('end', () => {
              centerCalls += 1;
              const token = new URLSearchParams(Buffer.concat(chunks).toString()).get('token');
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify(TOKENS[token] ?? { active: false }));
            });
          });

          const fail = (message) => { console.error('::error::' + message); process.exitCode = 1; };
          const is = (what, actual, expected) => {
            if (actual !== expected) fail(what + ': expected ' + expected + ', got ' + actual);
            else console.log('  ok  ' + what + ' -> ' + actual);
          };

          center.listen(0, '127.0.0.1', async () => {
            const auth = createExpressAuth({
              url: 'http://127.0.0.1:' + center.address().port + '/auth/v1/introspect',
              secret: 'runtime-proof-secret',
            });

            // tsoa's output: a PLAIN router carrying undeclared routes. It
            // cannot be secured() — every route it holds would be refused —
            // and it cannot be mounted bare. The guard leads the mount.
            const generated = express.Router();
            generated.get('/ships', (_req, res) => res.json({ ships: [] }));
            generated.post('/ships/:id/navigate', (_req, res) => res.json({ navigating: true }));

            const app = secured(express());
            app.use(
              '/api/fleet/v1',
              auth.guard(({ method }) => (method === 'GET' ? 'session' : 'fleet:control')),
              generated
            );
            app.use(notFound((_req, res) => {
              // Tries to answer 200. The wrapper must not let it.
              res.status(200).json({ error: { message: 'not found' } });
            }));

            const server = app.listen(0, '127.0.0.1');
            await new Promise((resolve) => server.once('listening', resolve));
            const base = 'http://127.0.0.1:' + server.address().port;
            const call = async (method, path, token) => {
              const response = await fetch(base + path, {
                method,
                headers: token ? { Authorization: 'Bearer ' + token } : {},
              });
              return response.status;
            };

            is('anonymous GET into the generated router', await call('GET', '/api/fleet/v1/ships'), 401);
            is('credentialed GET', await call('GET', '/api/fleet/v1/ships', 'session.token'), 200);
            is('POST on a session without the scope', await call('POST', '/api/fleet/v1/ships/1/navigate', 'session.token'), 403);
            is('POST on a session carrying it', await call('POST', '/api/fleet/v1/ships/1/navigate', 'operator.token'), 200);
            is('an inactive token', await call('GET', '/api/fleet/v1/ships', 'revoked.token'), 401);

            const before = centerCalls;
            is('an unmatched path', await call('GET', '/nope'), 404);
            is('anonymous POST at the terminal', await call('POST', '/admin/delete-everything'), 404);
            if (centerCalls !== before) fail('the terminal asked the center ' + (centerCalls - before) + ' time(s)');
            else console.log('  ok  the terminal never asks the center');

            server.close();
            center.close();
            if (process.exitCode) console.error('::error::the tarball does not enforce the documented shape');
            else console.log('the generated-router mount enforces at runtime, from the tarball');
          });
          JS
          node runtime-generated.js

      # Two `Authorization` lines, written to a raw socket, because no HTTP
      # client will send them: fetch, http.request and supertest all fold or
      # replace a repeated header. Node's parser keeps the first line and drops
      # the second, so an adapter reading `req.headers` alone verifies whichever
      # credential the caller put first. Proven from the packed tarball against
      # real Express, with a center that would call both tokens valid, so any
      # request that reached it would succeed and every call is counted.
      - name: Prove two Authorization lines are no credential, from the tarball
        run: |
          cd /tmp/consumer
          npm install --no-save express@4 > /dev/null
          cat > runtime-authorization-lines.js <<'JS'
          const http = require('node:http');
          const net = require('node:net');
          const express = require('express');
          const {
            actorOf,
            authorizationLines,
            createExpressAuth,
            createLaneDeriver,
            secured,
            soleAuthorizationLine,
          } = require('@v-m-pioneer-trading/clerk-client');

          const ACTIVE = (sub) => ({
            active: true, sub, kind: 'operator', scope: 'fleet:control', exp: 4102444800,
          });
          const TOKENS = { 'a.token': ACTIVE('user_a'), 'b.token': ACTIVE('user_b') };
          let centerCalls = 0;
          const center = http.createServer((req, res) => {
            const chunks = [];
            req.on('data', (c) => chunks.push(c));
            req.on('end', () => {
              centerCalls += 1;
              const token = new URLSearchParams(Buffer.concat(chunks).toString()).get('token');
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify(TOKENS[token] ?? { active: false }));
            });
          });

          const fail = (message) => { console.error('::error::' + message); process.exitCode = 1; };

          const raw = (port, method, path, lines) => new Promise((resolve, reject) => {
            const socket = net.connect(port, '127.0.0.1', () => {
              socket.write([
                method + ' ' + path + ' HTTP/1.1', 'Host: localhost', ...lines,
                ...(method === 'POST' ? ['Content-Length: 0'] : []),
                'Connection: close', '', '',
              ].join('\r\n'));
            });
            let received = '';
            socket.setEncoding('utf8');
            socket.on('data', (c) => { received += c; });
            socket.on('error', reject);
            socket.on('end', () => {
              const [head, ...rest] = received.split('\r\n\r\n');
              resolve({ status: Number(/^HTTP\/1\.1 (\d{3})/.exec(head)[1]), body: rest.join('\r\n\r\n') });
            });
          });

          center.listen(0, '127.0.0.1', async () => {
            const auth = createExpressAuth({
              url: 'http://127.0.0.1:' + center.address().port + '/auth/v1/introspect',
              secret: 'runtime-proof-secret',
            });
            const whoami = (_req, res) => res.json({ actor: actorOf(res) });
            const api = secured(express.Router());
            api.post('/scoped', auth.requireScope('fleet:control'), whoami);
            api.get('/public', auth.allowPublic(), whoami);
            api.get('/health', auth.ignoreCredentials(), whoami);
            const app = express();
            app.use('/api', api);
            // st-gateway's shape: the README's recipe in front of the deriver.
            const deriver = createLaneDeriver({
              url: 'http://127.0.0.1:' + center.address().port + '/auth/v1/introspect',
              secret: 'runtime-proof-secret',
            });
            app.get('/lane', (req, res) => {
              deriver.derive(soleAuthorizationLine(req)).then((lane) => res.json({ lane }));
            });
            const server = app.listen(0, '127.0.0.1');
            await new Promise((r) => server.once('listening', r));
            const port = server.address().port;

            const expect = async (what, method, path, lines, status, body, calls) => {
              const before = centerCalls;
              const got = await raw(port, method, path, lines);
              const made = centerCalls - before;
              if (got.status !== status) fail(what + ': expected ' + status + ', got ' + got.status);
              else if (body !== undefined && got.body !== body) fail(what + ': expected body ' + body + ', got ' + got.body);
              else if (made !== calls) fail(what + ': expected ' + calls + ' center call(s), got ' + made);
              else console.log('  ok  ' + what + ' -> ' + got.status + ', ' + made + ' center call(s)');
            };

            const two = ['Authorization: Bearer a.token', 'Authorization: Bearer b.token'];
            const noToken = '{"error":{"message":"a bearer token is required"}}';
            await expect('two lines, scoped POST', 'POST', '/api/scoped', two, 401, noToken, 0);
            await expect('two lines, allowPublic GET', 'GET', '/api/public', two, 200, '{"actor":null}', 0);
            await expect('two lines, ignoreCredentials GET', 'GET', '/api/health', two, 200, '{"actor":null}', 0);
            await expect('bearer then empty, scoped POST', 'POST', '/api/scoped',
              ['Authorization: Bearer a.token', 'Authorization: '], 401, noToken, 0);
            await expect('empty then bearer, scoped POST', 'POST', '/api/scoped',
              ['Authorization: ', 'Authorization: Bearer b.token'], 401, noToken, 0);
            await expect('empty then bearer, allowPublic GET', 'GET', '/api/public',
              ['Authorization: ', 'Authorization: Bearer b.token'], 200, '{"actor":null}', 0);
            await expect('two lowercase lines, scoped POST', 'POST', '/api/scoped',
              ['authorization: Bearer a.token', 'authorization: Bearer b.token'], 401, noToken, 0);
            await expect('one line, scoped POST', 'POST', '/api/scoped',
              ['Authorization: Bearer a.token'], 200, '{"actor":"user_a"}', 1);
            await expect('one lowercase line, scoped POST', 'POST', '/api/scoped',
              ['authorization: Bearer b.token'], 200, '{"actor":"user_b"}', 1);
            await expect('three lines, scoped POST', 'POST', '/api/scoped',
              ['Authorization: Bearer a.token', 'Authorization: Bearer b.token', 'Authorization: Bearer a.token'],
              401, noToken, 0);

            // Past 2 x maxHeadersCount header entries (2000 by default) Node 22
            // answers 431 before any handler runs, while Node 25 hands the app
            // a TRUNCATED rawHeaders in which a second line behind ~1000
            // fillers is not there to count. The library reads the limit off
            // the server and refuses at it, so on either version the center is
            // never asked: accept 431 (parser refused) or the app's own answer.
            const pastLimit = async (what, method, path, lines, status, body) => {
              const before = centerCalls;
              const got = await raw(port, method, path, lines);
              const made = centerCalls - before;
              if (made !== 0) fail(what + ': expected 0 center calls, got ' + made);
              else if (got.status === 431) console.log('  ok  ' + what + ' -> 431 from the parser, 0 center calls');
              else if (got.status !== status) fail(what + ': expected ' + status + ' or 431, got ' + got.status);
              else if (got.body !== body) fail(what + ': expected body ' + body + ', got ' + got.body);
              else console.log('  ok  ' + what + ' -> ' + got.status + ', 0 center calls');
            };
            const hidden = ['Authorization: Bearer a.token', ...Array(1100).fill('x: 1'), 'Authorization: Bearer b.token'];
            await pastLimit('second line behind 1100 fillers, scoped POST', 'POST', '/api/scoped', hidden, 401, noToken);
            await pastLimit('second line behind 1100 fillers, allowPublic GET', 'GET', '/api/public', hidden, 200, '{"actor":null}');
            await pastLimit('second line behind 1100 fillers, lane recipe', 'GET', '/lane', hidden, 200, '{"lane":"background"}');
            await expect('one line, lane recipe', 'GET', '/lane',
              ['Authorization: Bearer a.token'], 200, '{"lane":"interactive"}', 1);

            if (authorizationLines({ rawHeaders: ['authorization', 'x', 'Authorization', ''] }) !== 2) {
              fail('authorizationLines is not exported, or does not count case-insensitively');
            }
            if (authorizationLines({}) !== Infinity) {
              fail('authorizationLines reads a request with no rawHeaders as countable');
            }
            if (soleAuthorizationLine({ rawHeaders: ['Authorization', 'Bearer a'] }) !== 'Bearer a'
                || soleAuthorizationLine({ rawHeaders: ['Authorization', 'a', 'authorization', 'b'] }) !== null) {
              fail('soleAuthorizationLine is not exported, or does not return the one raw line');
            }

            server.close();
            center.close();
            if (process.exitCode) console.error('::error::the tarball verifies one of two Authorization lines');
            else console.log('two Authorization lines are no credential, from the tarball');
          });
          JS
          node runtime-authorization-lines.js

      # A center answer that names a key twice is a malformed answer (meta
      # fixture v5, #6): JSON.parse would let the last value win, where the Go
      # and Java clients answer 503. Since 2.0.1 (fixture v6) that includes two
      # top-level keys equal ignoring case and a miscased contract key, and
      # only space, tab, CR and LF separate scopes. Proven from the packed
      # tarball, so a build that shipped without the strict reader, or fell
      # back to JSON.parse or /\s+/, fails here and not in a consumer.
      - name: Prove a duplicated key is a malformed answer, from the tarball
        run: |
          cd /tmp/consumer
          cat > runtime-duplicate-key.js <<'JS'
          const http = require('node:http');
          const {
            MESSAGES,
            createAuthorizer,
            createLaneDeriver,
          } = require('@v-m-pioneer-trading/clerk-client');

          // Keyed on the token. The first body is the fixture's
          // center-returns-duplicate-key answer, byte for byte.
          const BODIES = {
            'duplicate.token.one':
              '{"active":true,"sub":"user_31qP8k2cQeXampleOperator","sub":"user_31qP8k2cQeXampleOther","scope":"fleet:control","exp":4102444800,"kind":"operator"}',
            'nested.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control","exp":4102444800,"kind":"operator","x":{"k":1,"k":2}}',
            'escaped.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control","exp":4102444800,"kind":"operator","s\\u0075b":"user_b"}',
            'case.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control","exp":4102444800,"kind":"operator","Active":false}',
            'miscased.token':
              '{"active":true,"sub":"user_a","Scope":"fleet:control","exp":4102444800,"kind":"operator"}',
            'kindcase.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control","exp":4102444800,"kind":"operator","Kind":"machine"}',
            'nbsp.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control\\u00a0agent:reset","exp":4102444800,"kind":"operator"}',
            'tab.token':
              '{"active":true,"sub":"user_a","scope":"agent:reset\\tfleet:control","exp":4102444800,"kind":"operator"}',
            'distinct.token':
              '{"active":true,"sub":"user_a","scope":"fleet:control","exp":4102444800,"kind":"operator","x":{"sub":"user_b"}}',
          };
          let centerCalls = 0;
          const center = http.createServer((req, res) => {
            const chunks = [];
            req.on('data', (c) => chunks.push(c));
            req.on('end', () => {
              centerCalls += 1;
              const token = new URLSearchParams(Buffer.concat(chunks).toString()).get('token');
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(BODIES[token] ?? '{"active":false}');
            });
          });

          const fail = (message) => { console.error('::error::' + message); process.exitCode = 1; };

          center.listen(0, '127.0.0.1', async () => {
            const config = {
              url: 'http://127.0.0.1:' + center.address().port + '/auth/v1/introspect',
              secret: 'runtime-proof-secret',
            };
            const authorizer = createAuthorizer(config);
            const deriver = createLaneDeriver(config);
            const decide = (token) => authorizer.authorize({
              method: 'POST', requires: 'fleet:control', authorization: 'Bearer ' + token,
            });

            for (const token of ['duplicate.token.one', 'nested.token', 'escaped.token', 'case.token', 'miscased.token']) {
              const before = centerCalls;
              const d = await decide(token);
              const made = centerCalls - before;
              if (d.outcome !== 'reject' || d.status !== 503 || d.message !== MESSAGES.centerUnavailable) {
                fail(token + ': expected 503 centerUnavailable, got ' + JSON.stringify(d));
              } else if (made !== 1) fail(token + ': expected 1 center call, got ' + made);
              else console.log('  ok  ' + token + ' -> 503, 1 center call');
            }
            const lane = await deriver.derive('Bearer duplicate.token.one');
            if (lane !== 'background') fail('duplicate key lane: expected background, got ' + lane);
            else console.log('  ok  duplicate key lane -> background');
            const caseLane = await deriver.derive('Bearer kindcase.token');
            if (caseLane !== 'background') fail('case-variant kind lane: expected background, got ' + caseLane);
            else console.log('  ok  case-variant kind lane -> background');
            const nbsp = await decide('nbsp.token');
            if (nbsp.outcome !== 'reject' || nbsp.status !== 403) {
              fail('a scope joined by U+00A0: expected 403, got ' + JSON.stringify(nbsp));
            } else console.log('  ok  a scope joined by U+00A0 is one scope -> 403');
            const tab = await decide('tab.token');
            if (tab.outcome !== 'proceed' || JSON.stringify(tab.identity.scopes) !== JSON.stringify(['agent:reset', 'fleet:control'])) {
              fail('a scope joined by a tab: expected proceed with two scopes, got ' + JSON.stringify(tab));
            } else console.log('  ok  a tab separates scopes -> proceed');
            const d = await decide('distinct.token');
            if (d.outcome !== 'proceed' || d.identity.sub !== 'user_a') {
              fail('the same key in two objects: expected proceed as user_a, got ' + JSON.stringify(d));
            } else console.log('  ok  the same key in two objects -> proceed as user_a');

            center.close();
            if (process.exitCode) console.error('::error::the tarball reads a duplicated key');
            else console.log('a duplicated key is a malformed answer, from the tarball');
          });
          JS
          node runtime-duplicate-key.js
