name: release

# A `v*` tag builds, tests, packs and attaches the tarball to a GitHub
# Release. There is no registry: GitHub Packages demands a token even for
# public packages, which breaks the Docker builds (auth-design.md decision 21).
# Consumers install the release asset URL and their package-lock pins its
# integrity hash, so no token and no git are needed inside node:22-alpine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The only place in this repository with write access, on the one job that
    # needs it — never at workflow level, where npm install scripts and test
    # code would inherit it.
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # is a movable pointer in someone else's repository, and this is the one
      # job in the repository that holds `contents: write`. The comment
      # records which release the SHA was, so a bump is a visible diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The `contents: write` token must not sit on disk while npm install
          # scripts and tests run; the publish step gets it through GH_TOKEN
          # and talks to the API, not git.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Refuse a tag that disagrees with package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $declared"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Pack
        id: pack
        run: |
          # `prepack` builds again; that is cheap and means the tarball can
          # never be stale relative to the source it was cut from.
          file=$(npm pack --silent | tail -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          tar -tzf "$file"

      - name: Publish the release with the tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never interpolated into the script body:
          # a `${{ }}` expression is pasted into the shell before it runs, so a
          # value carrying a quote or a `$(` would be executed rather than
          # read. This particular value is a filename we produced ourselves —
          # the point is that the shape is safe wherever it is copied next.
          TARBALL: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
